<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Project Chat</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>

<body>
    <h2>Project Chat</h2>

    <div>
        <label>Project ID:</label>
        <input id="projectId" value="YOUR_PROJECT_ID">
        <label>Room Type:</label>
        <select id="roomType">
            <option value="team">Team</option>
            <option value="supervisor">Supervisor</option>
        </select>
        <label>Token:</label>
        <input id="token" value="YOUR_JWT_TOKEN">
        <button onclick="joinProject()">Join</button>
    </div>

    <div id="chatBox" style="border:1px solid black; height:200px; overflow-y:auto; margin-top:10px;"></div>

    <div style="margin-top:10px;">
        <input id="messageInput" placeholder="Type a message">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        let socket;
        let currentProjectId = null;
        let currentRoomType = null;

        function joinProject() {
            const projectId = document.getElementById("projectId").value;
            const roomType = document.getElementById("roomType").value;
            const token = document.getElementById("token").value;

            if (!projectId || !roomType || !token) {
                alert("ProjectId, RoomType, and Token are required!");
                return;
            }

            // connect with auth token
            socket = io("http://localhost:5000", {
                auth: { token }
            });

            socket.on("connect", () => {
                console.log("✅ Connected:", socket.id);

                currentProjectId = projectId;
                currentRoomType = roomType;

                socket.emit("joinProject", { projectId, roomType });
            });

            socket.on("joinedProject", (data) => {
                console.log("Joined project:", data);
            });

            socket.on("messageHistory", (messages) => {
                const chatBox = document.getElementById("chatBox");
                chatBox.innerHTML = "";
                messages.forEach(m => {
                    const div = document.createElement("div");
                    div.textContent = `${m.sender.username}: ${m.content}`;
                    chatBox.appendChild(div);
                });
                chatBox.scrollTop = chatBox.scrollHeight;
            });

            socket.on("receiveMessage", (msg) => {
                const chatBox = document.getElementById("chatBox");
                const div = document.createElement("div");
                div.textContent = `${msg.sender.username}: ${msg.content}`;
                chatBox.appendChild(div);
                chatBox.scrollTop = chatBox.scrollHeight;
            });

            socket.on("error", (err) => {
                console.error("⚠️ Error:", err);
                alert(err);
            });

            socket.on("disconnect", () => {
                console.log("❌ Disconnected");
            });
        }

        function sendMessage() {
            const input = document.getElementById("messageInput");
            const content = input.value;
            if (!content) return;

            socket.emit("sendMessage", {
                projectId: currentProjectId,
                roomType: currentRoomType,
                content
            });
            input.value = "";
        }
    </script>
</body>

</html>
