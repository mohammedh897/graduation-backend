<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Socket.IO Chat Test</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f4f6f9;
        }

        .chat-container {
            width: 600px;
            margin: auto;
            border: 1px solid #ccc;
            border-radius: 10px;
            background: white;
            display: flex;
            flex-direction: column;
            height: 80vh;
        }

        .messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 70%;
            padding: 10px;
            border-radius: 12px;
            position: relative;
            word-wrap: break-word;
        }

        .message.right {
            align-self: flex-end;
            background: #007bff;
            color: white;
            border-bottom-right-radius: 0;
        }

        .message.left {
            align-self: flex-start;
            background: #e9ecef;
            color: black;
            border-bottom-left-radius: 0;
        }

        .username {
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 2px;
        }

        .timestamp {
            font-size: 11px;
            opacity: 0.6;
            margin-top: 5px;
            text-align: right;
        }

        .input-container {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ccc;
        }

        .input-container input {
            flex: 1;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
            margin-right: 10px;
        }

        .input-container button {
            padding: 8px 12px;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        .top-bar {
            padding: 10px;
            border-bottom: 1px solid #ccc;
            background: #f8f9fa;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .top-bar input {
            padding: 6px;
            flex: 1;
        }
    </style>
</head>

<body>
    <div class="chat-container">
        <div class="top-bar">
            <input type="text" id="token" placeholder="JWT Token">
            <input type="text" id="projectId" placeholder="Project ID">
            <select id="roomType">
                <option value="team">Team Room</option>
                <option value="supervisor">Supervisor Room</option>
            </select>
            <button onclick="joinRoom()">Join</button>
        </div>
        <div id="messages" class="messages"></div>
        <div class="input-container">
            <input type="text" id="messageInput" placeholder="Type a message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        let socket;
        let currentUserId = null;
        let projectId = null;
        let roomType = "team";

        // Decode JWT to extract user ID
        function decodeJWT(token) {
            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                return payload;
            } catch {
                return null;
            }
        }

        function renderMessage(msg) {
            const msgBox = document.getElementById("messages");
            const div = document.createElement("div");

            const isCurrentUser = msg.sender?._id === currentUserId || msg.sender === currentUserId;

            div.classList.add("message");
            div.classList.add(isCurrentUser ? "right" : "left");

            if (!isCurrentUser) {
                const user = document.createElement("div");
                user.classList.add("username");
                user.innerText = msg.sender?.username || "Unknown";
                div.appendChild(user);
            }

            const content = document.createElement("div");
            content.innerText = msg.content;
            div.appendChild(content);

            const time = document.createElement("div");
            time.classList.add("timestamp");
            const date = new Date(msg.createdAt || Date.now());
            time.innerText = date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
            div.appendChild(time);

            msgBox.appendChild(div);
            msgBox.scrollTop = msgBox.scrollHeight;
        }

        function joinRoom() {
            const token = document.getElementById("token").value.trim();
            projectId = document.getElementById("projectId").value.trim();
            roomType = document.getElementById("roomType").value;

            if (!token || !projectId) return alert("Please enter token and projectId");

            const decoded = decodeJWT(token);
            if (!decoded || !decoded.id) return alert("Invalid token - cannot get userId");
            currentUserId = decoded.id;

            // Only connect once
            if (!socket) {
                socket = io("http://localhost:5000", { auth: { token } });

                socket.on("connect", () => console.log("✅ Connected", socket.id));
                socket.on("error", (err) => alert(typeof err === "string" ? err : err.message));
                socket.on("disconnect", () => console.log("❌ Disconnected"));
            }

            // Join/switch room
            socket.emit("joinProject", { projectId, roomType });

            // Clear messages when switching rooms
            document.getElementById("messages").innerHTML = "";

            socket.off("messageHistory");
            socket.off("receiveMessage");

            socket.on("messageHistory", (messages) => {
                messages.forEach(m => {
                    if (m.roomType === roomType) renderMessage(m);
                });
            });

            socket.on("receiveMessage", (msg) => {
                if (msg.roomType === roomType) renderMessage(msg);
            });

            socket.on("joinedProject", (data) => {
                console.log("Joined room:", data);
            });
        }

        function sendMessage() {
            const content = document.getElementById("messageInput").value.trim();
            if (!content) return;
            socket.emit("sendMessage", { projectId, roomType, content });
            document.getElementById("messageInput").value = "";
        }
    </script>
</body>

</html>
